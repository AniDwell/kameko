name: Quick Get SHA-1
on: [workflow_dispatch]

jobs:
  show-key:
    runs-on: ubuntu-latest
    steps:
      - name: Get Cached Keystore
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.android/debug.keystore
          key: kameko-permanent-keystore

      - name: Generate if missing
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: SHOW MY FINGERPRINT
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android
